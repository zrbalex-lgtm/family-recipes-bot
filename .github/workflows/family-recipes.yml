name: Family recipes checks
on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/family-recipes.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Unit tests
        run: deno test supabase/functions/family-recipes-bot/routing_test.ts supabase/functions/family-recipes-bot/update-policy_test.ts
      - name: Type check entrypoint
        run: deno check supabase/functions/family-recipes-bot/index.ts
